name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'switchvn-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the release under'
        required: true

env:
  ASSET: switchvn-envideo-aarch64.tar.gz

jobs:
  build:
    # Matches the Switch's Ubuntu 24.04 userspace, so the binaries link against
    # the same glibc the target has.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          # src/nvidia/open-gpu-kernel-modules is a nested submodule; without it
          # meson fails at configure time on a missing include directory.
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config g++

      - name: Configure
        # tegra-drm must stay off: switchroot's L4T kernel has no Tegra DRM
        # channel/submit UAPI, and every submission comes back ENOTTY with it on.
        run: |
          meson setup build \
            -Dnvgpu=enabled \
            -Dtegra-drm=false \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release

      - name: Build
        run: meson compile -C build

      - name: Stage install tree
        run: |
          meson install -C build --destdir "$GITHUB_WORKSPACE/stage"
          find stage -type f | sort

      - name: Stamp the build
        # libenvideo.so has an unversioned SONAME, so the dynamic linker will
        # happily load any copy into libavcodec no matter what it was compiled
        # against, and a mismatch shows up as broken decoding rather than as a
        # link error. Record which commit this is; SwitchVN-FFmpeg records the
        # one it built against, and the installer compares the two.
        run: |
          mkdir -p stage/usr/local/share/switchvn
          echo "${{ github.sha }}" > stage/usr/local/share/switchvn/envideo-commit
          cat stage/usr/local/share/switchvn/envideo-commit

      - name: Package
        run: tar -czf "$ASSET" -C stage/usr/local .

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "envideo for SwitchVN"
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Verify the asset is actually published
        # A release lives on its tag, so anything that removes the tag removes
        # the release with it -- and gh release upload can then no-op without a
        # non-zero exit, leaving a green build and nothing to download. Read the
        # asset list back and fail if it is not there.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          names=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          echo "$names"
          printf '%s\n' "$names" | grep -qx 'switchvn-envideo-aarch64.tar.gz' \
            || { echo "::error::switchvn-envideo-aarch64.tar.gz is not attached to release $TAG"; exit 1; }
